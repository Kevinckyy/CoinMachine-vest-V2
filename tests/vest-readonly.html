<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>本地账户读取测试</title></head>
<body><button data-testid="account-selector-trigger" aria-expanded="false"><span class="truncate">Alpha</span><span>Evaluation</span><span>1/2</span></button>
<section id="deskAccounts" hidden><div role="tablist"><button role="tab" id="desk-trigger-active" aria-selected="true">活跃</button></div>
<p data-testid="dashboard-total-value">$3,050.00</p><div class="grid"></div></section>
<nav><a href="/portfolio">Portfolio</a><a href="/trade/NQ-PERP">Trade</a></nav>
<section id="portfolioMetrics">
<p data-testid="account-value">$1,050.00</p><p data-testid="account-upnl">$0.00</p><p data-testid="book-mark">$20,000</p>
<p data-testid="account-health">90%</p>
<div><span id="lossHelp" data-slot="tooltip-trigger">每日亏损</span><p data-testid="capital-indicator-daily-loss">$0.00 / $30.00</p></div>
<div id="lossLabels" role="tooltip" hidden><span>美东时间晚上8点余额：$1,000.00</span><span>今日底线：$970.00</span></div>
<span data-testid="capital-indicator-drawdown">$26.08 / $300</span>
</section>
<button data-testid="account-tab-active-positions" aria-selected="true" aria-controls="positions">Active positions</button>
<div id="positions"><p>No positions yet</p></div>
<button data-testid="account-tab-positions-history" aria-selected="false" aria-controls="closed">Positions history</button>
<button data-testid="account-tab-order-history" aria-selected="false" aria-controls="orders">Order history</button>
<div id="closed" hidden></div><div id="orders" hidden></div>
<button role="tab" id="desk-withdrawals" aria-controls="payouts" aria-selected="false" hidden>Payout history</button>
<div id="payouts" hidden></div>
<script>
  const trigger = document.querySelector('button');
  const lossHelp=document.getElementById('lossHelp'), labels=document.getElementById('lossLabels');
  lossHelp.onpointerover=()=>{labels.hidden=false;lossHelp.setAttribute('aria-describedby',labels.id);};
  lossHelp.onpointerout=()=>{labels.hidden=true;lossHelp.removeAttribute('aria-describedby');};
  function tradeEquity(name,equity) {
    return name==='Alpha' && sessionStorage.getItem('tradeEquity') || equity;
  }
  document.querySelector('[data-testid="account-value"]').textContent=tradeEquity('Alpha','$1,050.00');
  const accounts = [['Alpha','eval','Evaluation','1/2','$1,050.00'],['Beta','funded','Funded','Live','$2,000.00']];
  let menu;
  const onAccounts=location.pathname==='/accounts';
  document.getElementById('deskAccounts').hidden=!onAccounts;
  const tradeSelector = location.pathname.startsWith('/trade/') && sessionStorage.getItem('tradeSelector');
  trigger.hidden = onAccounts || !!tradeSelector;
  if (tradeSelector === 'delayed') {
    const label = trigger.querySelector('span.truncate');
    const name = label.textContent;
    label.textContent = '';
    setTimeout(() => {
      trigger.hidden = false;
      setTimeout(() => { label.textContent = name; }, 500);
    }, 1800);
  }
  function renderCards() {
    const grid=document.querySelector('#deskAccounts .grid');
    grid.replaceChildren();
    for(const [name,code,category,phase,equity] of accounts) {
      const link=document.createElement('a'); link.href='/portfolio';
      link.innerHTML='<p><span class="truncate">'+name+'</span><button data-testid="edit-account-name-'+name+'"></button></p><span data-slot="badge">'+phase+'</span><span data-slot="badge">'+category+'</span>'+
        '<div><p>账户价值</p><p>'+equity+'</p><p>+$111.50 (+10.77%)</p></div><div><p>每日亏损</p><p>$0.00 / '+(name==='Beta'?'$145.96':'$30.00')+'</p></div>'+
        '<div><p>回撤</p><p>$26.08 / $300</p></div><p>'+(name==='Beta'?1:0)+' 笔影响账户的交易</p>';
      grid.append(link);
    }
  }
  if(sessionStorage.getItem('purchased')) accounts.push(['Gamma','eval','Evaluation','1/2','$1000.00']);
  if(sessionStorage.getItem('scanReplacement')) accounts.splice(1,1,['Gamma','eval','Evaluation','1/2','$1,275.00']);
  renderCards();
  if(onAccounts && sessionStorage.getItem('partialDirectory')) {
    const grid=document.querySelector('#deskAccounts .grid');
    grid.lastElementChild.remove();
    grid.setAttribute('aria-busy','true');
  }
  const td = (key, html) => '<td data-testid="td-' + key + '">' + html + '</td>';
  const market = '<a href="/trade/NQ-PERP"><p>NQ</p><p>Long 2x</p></a>';
  const clock = value => '<time datetime="' + value + '">' + value + '</time>';
  const payout = (name,id,net,status) => '<tr>' + td('accountId','<button><span class="truncate">'+name+'</span></button>') +
    td('id',id) + td('createdAt',clock('2026-11-23T13:00:00Z')) + td('updatedAt',clock('2026-11-23T15:00:00Z')) +
    td('executedAt',clock('2026-11-23T15:00:00Z')) + td('requestedAmount','$50.00') + td('traderAmount',net) + td('status',status) + '</tr>';
  document.getElementById('payouts').innerHTML='<table><tbody>'+payout('Beta','ab...123','$40.00','Completed')+
    payout('Beta','ef...345','$15.00','已退款')+payout('Other','cd...234','$30.00','Completed')+'</tbody></table>';
  function showHistory(name) {
    const stage = title => '<tr><td colspan="8"><div data-testid="positions-history-step-test"><span>' + title + '</span></div></td></tr>';
    const position = (ref, pnl) => '<tr>' + td('symbol',market) + td('quantity','2') + td('openPrice','$20,000') + td('closePrice','$20,010') +
      td('openDate',clock('2026-11-23T13:00:00Z')) + td('closeDate',clock('2026-11-23T15:00:00Z')) +
      td('pnl','<span data-testid="position-history-pnl-' + ref + '">' + pnl + '</span>') + '</tr>';
    document.getElementById('closed').innerHTML = '<table><tbody>' + (name === 'Alpha' ? stage('Step 1 Evaluation') + position('p-a','+$20.50') :
      stage('第 2 阶段评估') + position('p-b','-$7.25') + stage('Live') + position('p-c','$0.00')) + '</tbody></table>';
    const orders = document.getElementById('orders');
    orders.innerHTML = '<div style="height:75px;overflow-y:auto"><table><tbody><tr>' + td('symbol',market) + td('type','Market') +
      td('size','2 / 2') + td('executedPrice','$20,000') + td('createdAt','11/23/2026 10:00:00') +
      td('updatedAt','11/23/2026 10:01:00') + td('id','abcd...'+(name === 'Alpha' ? '0001' : '0002')) +
      td('status','Filled') + '</tr></tbody></table><div aria-hidden="true" style="height:140px"></div></div>';
    if(name==='Alpha') orders.firstElementChild.onscroll = e => {
      if(e.target.scrollTop<5 || orders.querySelectorAll('tr').length>1) return;
      const older=orders.querySelector('tr').cloneNode(true);
      older.querySelector('[data-testid=td-id]').textContent='old1...0033';
      older.querySelector('[data-testid=td-createdAt]').textContent='11/22/2026 10:00:00';
      orders.querySelector('tbody').append(older);
    };
  }
  showHistory('Alpha');
  document.querySelectorAll('button[aria-controls]').forEach(tab => tab.onclick = () => {
    for (const el of document.querySelectorAll('button[aria-controls]')) {
      el.setAttribute('aria-selected',String(tab === el));
      document.getElementById(el.getAttribute('aria-controls')).hidden = el !== tab;
    }
  });
  function route() {
    document.getElementById('portfolioMetrics').dataset.testid=location.pathname==='/portfolio'?'portfolio-root':'trade-metrics';
    trace('page',location.pathname);
    document.getElementById('desk-withdrawals').hidden=location.pathname !== '/portfolio';
    document.querySelector('[data-testid=account-tab-active-positions]').click();
  }
  document.querySelectorAll('nav a').forEach(link => link.onclick = e => {
    e.preventDefault();history.pushState({},'',link.pathname);route();
  });
  route();
  function trace(event,value) {
    if(sessionStorage.getItem('scanTrace')===null) return;
    const events=JSON.parse(sessionStorage.getItem('scanTrace'));
    events.push([event,value]);
    sessionStorage.setItem('scanTrace',JSON.stringify(events));
  }
  function closeMenu() {
    menu?.remove(); menu=null; trigger.setAttribute('aria-expanded','false');
  }
  function openMenu() {
    if (menu) return;
    trace('menu',location.pathname);
    sessionStorage.setItem('opens',String(Number(sessionStorage.getItem('opens') || 0)+1));
    menu=document.createElement('div');menu.setAttribute('role','menu');
    menu.onkeydown=e=>{if(e.key==='Escape')closeMenu();};
    accounts.forEach(([name,code,category,phase,equity])=>{
      const item=document.createElement('button');item.dataset.testid='account-item-'+code;
      item.innerHTML='<span class="truncate">'+name+'</span><span>'+category+'</span><span>'+phase+'</span>';
      item.onclick=()=>{
        trace('select',name);
        trigger.innerHTML=item.innerHTML;
        document.querySelector('[data-testid="account-value"]').textContent=tradeEquity(name,equity);
        document.querySelector('[data-testid="capital-indicator-daily-loss"]').textContent=name==='Beta'?'$0.00 / $145.96':'$0.00 / $30.00';
        if(location.pathname==='/portfolio' && name==='Gamma') {
          document.querySelector('[data-testid="account-health"]').textContent='83%';
          const limits=document.createElement('section');
          limits.setAttribute('aria-labelledby','evaluation-limits-title');
          for(const [key,pair] of [['daily-loss','$4.00 / $38.25'],['drawdown','$18.25 / $255.00']]) {
            document.querySelector('[data-testid="capital-indicator-'+key+'"]').hidden=true;
            const group=document.createElement('div');
            group.innerHTML='<svg width="32" height="32" aria-hidden="true"><path data-testid="multi-step-'+key+'-gauge-progress" d="M1 1L12 12"></path></svg><div><p>Limit</p><p aria-label="Limit: '+pair+'">'+pair+'</p></div>';
            limits.append(group);
          }
          document.getElementById('portfolioMetrics').append(limits);
        }
        labels.firstElementChild.textContent='美东时间晚上8点余额：'+(name==='Beta'?'$4,865.33':'$1,000.00');
        labels.lastElementChild.textContent='今日底线：'+(name==='Beta'?'$4,719.37':'$970.00');
        showHistory(name);
        closeMenu();
      };
      menu.append(item);
    });
    document.body.append(menu);trigger.setAttribute('aria-expanded','true');
  }
  trigger.onkeydown=e=>{if(e.key==='ArrowDown')openMenu();if(e.key==='Escape')closeMenu();};
  trigger.onclick=()=>{if(menu)closeMenu();else openMenu();};
</script></body></html>
