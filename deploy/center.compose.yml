name: vest-center
services:
  center:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-B", "-m", "fleet", "center", "--host", "0.0.0.0", "--db", "/data/center.sqlite3"]
    environment:
      VEST_ADMIN_TOKEN: ${VEST_ADMIN_TOKEN:?set VEST_ADMIN_TOKEN}
    volumes:
      - ../fleet:/app/fleet:ro
      - ../web:/app/web:ro
      - ../extension/manifest.json:/app/extension/manifest.json:ro
      - ../extension/archive.js:/app/extension/archive.js:ro
      - center-data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [center]
    environment:
      VEST_DOMAIN: ${VEST_DOMAIN:?set VEST_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./center.Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - caddy-config:/config
volumes:
  center-data:
  tls-data:
  caddy-config:
